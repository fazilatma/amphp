# Apache front-end for Scraper4 VPS (Python on gunicorn :8000).
# Install via tools/vps-live/install_scraper4_vps.sh
#
# http://SERVER/           → Scraper4 Python UI
# http://SERVER/scraper4.php  stays on Apache if that file exists.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    # Keep a PHP copy reachable if present; everything else is the Python app.
    ProxyPass /scraper4.php !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/scraper4-error.log
    CustomLog ${APACHE_LOG_DIR}/scraper4-access.log combined
</VirtualHost>
